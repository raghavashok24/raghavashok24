<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04070d"/>
      <stop offset="45%" stop-color="#0a1622"/>
      <stop offset="100%" stop-color="#0f2a2e"/>
    </linearGradient>

    <linearGradient id="textGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e8fbff"/>
      <stop offset="100%" stop-color="#7fe3d0"/>
    </linearGradient>

    <pattern id="diagLines" width="70" height="70" patternUnits="userSpaceOnUse">
      <line x1="0" y1="70" x2="70" y2="0" stroke="#4de3c8" stroke-opacity="0.16" stroke-width="1"/>
      <animateTransform attributeName="patternTransform" type="translate"
        from="0 0" to="70 -70" dur="3.2s" repeatCount="indefinite"/>
    </pattern>

    <pattern id="fineGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0 L0 0 0 24" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4de3c8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#4de3c8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#4de3c8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#fineGrid)"/>
  <rect width="1200" height="300" fill="url(#diagLines)"/>

  <rect width="1200" height="60" fill="url(#scanGrad)">
    <animate attributeName="y" from="-60" to="300" dur="5s" repeatCount="indefinite"/>
  </rect>

  <circle cx="120" cy="60" r="2.5" fill="#4de3c8">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1080" cy="240" r="2.5" fill="#4de3c8">
    <animate attributeName="opacity" values="1;0.2;1" dur="2.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1000" cy="55" r="2" fill="#e8fbff">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="1.9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="150" cy="245" r="2" fill="#e8fbff">
    <animate attributeName="opacity" values="1;0.3;1" dur="2.2s" repeatCount="indefinite"/>
  </circle>

  <text x="600" y="145" text-anchor="middle" font-family="'Courier New', monospace" font-size="52"
        font-weight="700" letter-spacing="4" fill="url(#textGlow)" filter="url(#glow)">
    SHRIRAGHAV ASHOK
  </text>

  <text x="600" y="185" text-anchor="middle" font-family="'Courier New', monospace" font-size="17"
        letter-spacing="2" fill="#9fb4b8">
    Building AI Systems for Financial Resilience
  </text>

  <line x1="450" y1="205" x2="750" y2="205" stroke="#4de3c8" stroke-opacity="0.4" stroke-width="1"/>
</svg>
